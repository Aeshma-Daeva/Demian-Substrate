[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demian-v1"
version = "1.0.0"
description = "Stable synthesized Demian v1 recurrent gate-state runtime"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
include = ["demian_v1*", "development*", "legacy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
